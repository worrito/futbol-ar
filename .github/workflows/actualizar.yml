name: Actualizar calendarios

on:
  schedule:
    - cron: "0 9 * * *"   # todos los días, 6:00 hs de Argentina
  workflow_dispatch:       # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar calendarios
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python3 actualizar_calendario.py

      - name: Guardar cambios
        run: |
          git config user.name "calendario-bot"
          git config user.email "calendario-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Actualizar calendarios"
          git push
